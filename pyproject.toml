[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ninjavault-cdn"
dynamic = ["version"]
description = "Typed sync and async Python client for the NinjaVault CDN Server: upload, search, download and share files."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "NinjaVault" }]
keywords = ["ninjavault", "cdn", "file-storage", "upload", "presigned-url", "httpx", "sdk", "asyncio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/alisaivi786/NinjaVault-Python"
Repository = "https://github.com/alisaivi786/NinjaVault-Python"
Documentation = "https://github.com/alisaivi786/NinjaVault-Python#readme"
Issues = "https://github.com/alisaivi786/NinjaVault-Python/issues"
Changelog = "https://github.com/alisaivi786/NinjaVault-Python/tree/main/changesets"

# --------------------------------------------------------------------------------------------------
# Build
# --------------------------------------------------------------------------------------------------

[tool.hatch.version]
path = "src/ninjavault_cdn/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ninjavault_cdn"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ninjavault_cdn",
  "tests",
  "changesets",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
]

# --------------------------------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "S", "PT", "PL", "TID", "RET", "PIE", "ANN",
]
ignore = [
  "PLR0913", # public API mirrors the .NET client's argument list
  "PLR0917", # upload's positional arguments match the .NET request record
  "PLR2004", # magic values are fine in HTTP status handling
  "ANN401",  # JSON payloads are genuinely Any
  "UP007",   # keep Union[...] for runtime type aliases on Python 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "PLR0915", "PLC0415", "SIM117"]
"scripts/**" = ["S603", "T201"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ninjavault_cdn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
