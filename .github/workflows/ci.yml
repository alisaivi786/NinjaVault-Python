name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Type check (mypy --strict)
        run: python -m mypy

      - name: Test (pytest + coverage)
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check --strict dist/*

      - name: Change-set check
        run: python scripts/check_changeset.py

      - name: Smoke-test the wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -x "$RUNNER_TEMP/smoke/bin/python" ]; then SMOKE="$RUNNER_TEMP/smoke/bin/python"; else SMOKE="$RUNNER_TEMP/smoke/Scripts/python"; fi
          "$SMOKE" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$SMOKE" -c "import ninjavault_cdn; print(ninjavault_cdn.__version__)"

      - name: Upload dist
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
